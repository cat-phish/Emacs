# PIECE 2 of 3: one automation. In Settings > Automations, create a new
# automation, open the menu > "Edit in YAML", and paste this whole file.
# It replaces the old "Tasks" and shopping-list automations: disable those
# (don't delete them yet) so they can't win the same sentences.
#
# Based on the old Tasks automation. Each trigger only picks the verb; the
# engine finds the list or heading in the rest of the sentence.
alias: Voice - Org files
description: One trigger per verb; the engine finds the target in the free text.
mode: queued
triggers:
  - trigger: conversation
    id: capture
    command:
      - capture {text}
      - add {text}
  - trigger: conversation
    id: backlog_first
    command:
      # "add to the barista assistant backlog dark mode": the place comes first
      - add [to] [the|my] {name} backlog {text}
  - trigger: conversation
    id: answer
    command:
      # Answers said as a new command: from a device that can't be asked a
      # question (the phone app, typed text), or when a satellite asks and
      # doesn't listen.
      - '[it''s|it is|its] due {text}'
      - (no deadline|no due date)
      - '[it''s|it is|its] for {text}'
  - trigger: conversation
    id: done
    command:
      - check off {text}
      - done {text}
      - I got {text}
      - mark [the|my] {text} [as] done
  - trigger: conversation
    id: paid
    command:
      - I paid [the|my] {text}
      - mark [the|my] {text} [as] paid
  - trigger: conversation
    id: out
    command:
      - '{place} is [all] out of {text}'
      - '{place}''s out of {text}'
      - (we're|we are) [all] out of {text}
  - trigger: conversation
    id: bills
    command:
      - what bills are (due|left|unpaid|coming up)
      - what bills do I (have|owe|need to pay)
  - trigger: conversation
    id: read_default
    command:
      - what do I (have|need) to do
  - trigger: conversation
    id: read
    command:
      - (what's|what is) (on|in) [the|my] {text}
      - read [the|my] {text}
  - trigger: conversation
    id: undo
    command:
      - undo [that|the last change|my last capture]
  - trigger: conversation
    id: cancel
    command:
      - (scratch|cancel|forget) that
      - never mind
variables:
  # The voice satellite that heard the command, if any. Follow-up questions are
  # asked on it; without one (phone app, typed text) the question is the reply.
  satellite: >-
    {{ device_entities(trigger.device_id) | select('match', 'assist_satellite\\.')
       | list | first | default('') if trigger.device_id else '' }}
  verb: >-
    {{ {'backlog_first': 'capture', 'read_default': 'read'}.get(trigger.id, trigger.id) }}
  text: >-
    {%- set s = trigger.slots | default({}) -%}
    {%- if trigger.id == 'answer' -%}{{ trigger.sentence }}
    {%- elif trigger.id == 'backlog_first' -%}{{ s.name }} backlog {{ s.text }}
    {%- elif trigger.id == 'out' and s.place is defined -%}{{ s.place }} is out of {{ s.text }}
    {%- elif trigger.id == 'out' -%}we're out of {{ s.text }}
    {%- elif trigger.id == 'read_default' -%}
    {%- else -%}{{ s.text | default('') }}
    {%- endif -%}
actions:
  - action: shell_command.org_voice
    continue_on_error: true
    data:
      verb: "{{ verb }}"
      text: "{{ text }}"
    response_variable: result
  - variables:
      reply: |-
        {{ result.stdout | from_json if result is defined and result.stdout
           else {'say': "Sorry, I couldn't update your lists.", 'ask': false} }}
  - if:
      - condition: template
        value_template: "{{ reply.ask and satellite != '' }}"
    then:
      # Finish this conversation silently; the script asks the question and listens.
      - set_conversation_response: ""
      - action: script.turn_on
        target:
          entity_id: script.voice_follow_up
        data:
          variables:
            question: "{{ reply.say }}"
            satellite: "{{ satellite }}"
    else:
      - set_conversation_response: "{{ reply.say }}"
