# PIECE 3 of 3: one script. In Settings > Scripts, create a new script, open
# the menu > "Edit in YAML", and paste this whole file. The entity must end up
# as script.voice_follow_up (the automation calls it by that name).
# It replaces script.tasks_follow_up; leave the old one until this works.
#
# One question per run (queued). A question with no answer is asked once more,
# because the Echo sometimes speaks and then doesn't listen; after that the
# engine is told "" and drops it quietly. At most three questions in a row.
alias: Voice follow-up
mode: queued
max: 5
fields:
  question:
    description: What to ask
  attempt:
    description: 1 for the first try, 2 for the re-ask
    default: 1
  depth:
    description: How many questions in a row so far
    default: 1
sequence:
  - action: assist_satellite.ask_question
    target:
      entity_id: assist_satellite.echo_dot_3_e514bc_assist_satellite
    data:
      question: "{{ question }}"
      preannounce: false
    response_variable: heard
  - variables:
      answer: "{{ (heard.sentence if heard is defined and heard.sentence else '') | trim }}"
  - if: "{{ answer == '' and attempt | int(1) < 2 }}"
    then:
      - action: script.turn_on
        target:
          entity_id: script.voice_follow_up
        data:
          variables:
            question: "{{ question }}"
            attempt: 2
            depth: "{{ depth }}"
      - stop: Re-asking once
  - action: shell_command.org_voice
    data:
      verb: answer
      text: "{{ answer }}"
    response_variable: result
  - variables:
      reply: >-
        {{ result.stdout | from_json if result.returncode == 0 and result.stdout
           else {'say': '', 'ask': false} }}
  - choose:
      - conditions: "{{ reply.ask and depth | int(1) < 3 }}"
        sequence:
          - action: script.turn_on
            target:
              entity_id: script.voice_follow_up
            data:
              variables:
                question: "{{ reply.say }}"
                attempt: 1
                depth: "{{ depth | int(1) + 1 }}"
      - conditions: "{{ not reply.ask and reply.say != '' }}"
        sequence:
          - action: assist_satellite.announce
            target:
              entity_id: assist_satellite.echo_dot_3_e514bc_assist_satellite
            data:
              message: "{{ reply.say }}"
              preannounce: false
