# PIECE 3 of 3: one script. In Settings > Scripts, create a new script, open
# the menu > "Edit in YAML", and paste this whole file. The entity must end up
# as script.voice_follow_up (the automation calls it by that name).
#
# This is the old "Tasks follow-up" script with only the names changed
# (script.voice_follow_up, shell_command.org_voice with verb: answer).
# Leave script.tasks_follow_up in place until this one works.
#
# One question per run (queued). It waits for the Echo to go idle first.
# A question with no answer is asked once more, because the Echo sometimes
# speaks and then doesn't listen; after that it stops quietly, and the
# question stays open for 10 minutes so "it's due Friday" still works.
# At most three questions in a row.
alias: Voice follow-up
mode: queued
max: 5
sequence:
  - wait_template: >-
      {{ is_state('assist_satellite.echo_dot_3_e514bc_assist_satellite', 'idle') }}
    timeout: "00:00:15"
  - delay: 1
  - action: assist_satellite.ask_question
    continue_on_error: true
    data:
      entity_id: assist_satellite.echo_dot_3_e514bc_assist_satellite
      question: "{{ question }}"
      preannounce: false
    response_variable: answer
  - if:
      - condition: template
        value_template: "{{ answer is not defined or not (answer.sentence | default('')) }}"
    then:
      - if:
          - condition: template
            value_template: "{{ not (retried | default(false)) }}"
        then:
          - action: script.turn_on
            target:
              entity_id: script.voice_follow_up
            data:
              variables:
                question: "{{ question }}"
                attempt: "{{ attempt | default(1) }}"
                retried: true
      - stop: No answer from the satellite
  - action: shell_command.org_voice
    data:
      verb: answer
      text: "{{ answer.sentence }}"
    response_variable: result
  - variables:
      reply: |-
        {{ result.stdout | from_json if result.stdout
           else {'say': 'Sorry, something went wrong.', 'ask': false} }}
      attempt: "{{ (attempt | default(1)) | int }}"
  - if:
      - condition: template
        value_template: "{{ reply.ask and attempt < 3 }}"
    then:
      - action: script.turn_on
        target:
          entity_id: script.voice_follow_up
        data:
          variables:
            question: "{{ reply.say }}"
            attempt: "{{ attempt + 1 }}"
    else:
      - if:
          - condition: template
            value_template: "{{ reply.say | length > 0 }}"
        then:
          - action: assist_satellite.announce
            data:
              entity_id: assist_satellite.echo_dot_3_e514bc_assist_satellite
              message: "{{ \"Sorry, I didn't catch that.\" if reply.ask else reply.say }}"
              preannounce: false
